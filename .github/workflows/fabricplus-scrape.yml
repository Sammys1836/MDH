name: One-time FabricPlus catalog scrape

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fabricplus-scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Crawl FabricPlus.net
        run: |
          cat > /tmp/fabricplus_scrape.py <<'PY'
          import asyncio, json, re, time
          from urllib.parse import urljoin, urlparse, urldefrag
          from playwright.async_api import async_playwright

          BASE = "https://www.fabricplus.net"
          SEEDS = [
              BASE + "/",
              BASE + "/collections",
              BASE + "/collections?category=Sheers",
              BASE + "/collections?category=Drapery",
              BASE + "/collections?category=Blackouts%20%26%20dimouts",
              BASE + "/collections?category=Upholstery",
              BASE + "/collections?category=Linings",
          ]
          MAX_PAGES = 150

          def norm(url):
              try:
                  url, _ = urldefrag(url)
                  p = urlparse(url)
                  if p.scheme not in ("http", "https"):
                      return None
                  host = p.netloc.lower().replace(":443", "")
                  if host not in ("fabricplus.net", "www.fabricplus.net"):
                      return None
                  path = re.sub(r"/+", "/", p.path or "/")
                  return "https://www.fabricplus.net" + path + (("?" + p.query) if p.query else "")
              except Exception:
                  return None

          def crawlable(url):
              p = urlparse(url)
              return p.path == "/" or p.path.startswith("/collections")

          async def main():
              pages = []
              api = {}
              seen = set()
              queue = list(SEEDS)
              errors = []

              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  context = await browser.new_context(
                      viewport={"width": 1440, "height": 1100},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
                  )
                  page = await context.new_page()

                  async def capture_response(response):
                      try:
                          ctype = (response.headers.get("content-type") or "").lower()
                          u = response.url
                          if "json" not in ctype:
                              return
                          if "fabricplus.net" not in u:
                              return
                          body = await response.text()
                          if len(body) > 5_000_000:
                              return
                          api[u] = body
                      except Exception:
                          pass

                  page.on("response", capture_response)

                  while queue and len(seen) < MAX_PAGES:
                      raw = queue.pop(0)
                      url = norm(raw)
                      if not url or url in seen or not crawlable(url):
                          continue
                      seen.add(url)
                      try:
                          resp = await page.goto(url, wait_until="domcontentloaded", timeout=45000)
                          try:
                              await page.wait_for_load_state("networkidle", timeout=12000)
                          except Exception:
                              await page.wait_for_timeout(2500)

                          data = await page.evaluate("""() => {
                            const absolute = (v) => {
                              try { return new URL(v, location.href).href; } catch { return v || ""; }
                            };
                            const links = [...document.querySelectorAll("a[href]")].map(a => ({
                              href: absolute(a.getAttribute("href")),
                              text: (a.innerText || a.textContent || "").trim()
                            }));
                            const images = [...document.images].map(img => ({
                              src: absolute(img.currentSrc || img.src || img.getAttribute("src") || ""),
                              alt: (img.alt || "").trim(),
                              width: img.naturalWidth || img.width || 0,
                              height: img.naturalHeight || img.height || 0,
                              srcset: img.srcset || ""
                            })).filter(x => x.src);
                            const backgrounds = [];
                            for (const el of document.querySelectorAll("*")) {
                              const bg = getComputedStyle(el).backgroundImage;
                              if (!bg || bg === "none") continue;
                              for (const m of bg.matchAll(/url\\(["']?(.*?)["']?\\)/g)) {
                                if (m[1]) backgrounds.push(absolute(m[1]));
                              }
                            }
                            const jsonScripts = [...document.querySelectorAll('script[type="application/ld+json"], script#__NEXT_DATA__')].map(s => s.textContent || "");
                            const metas = {};
                            for (const m of document.querySelectorAll("meta[property],meta[name]")) {
                              const k = m.getAttribute("property") || m.getAttribute("name");
                              const v = m.getAttribute("content");
                              if (k && v) metas[k] = v;
                            }
                            return {
                              title: document.title || "",
                              h1: [...document.querySelectorAll("h1")].map(x => (x.innerText || "").trim()),
                              h2: [...document.querySelectorAll("h2")].map(x => (x.innerText || "").trim()),
                              h3: [...document.querySelectorAll("h3")].map(x => (x.innerText || "").trim()),
                              text: (document.body?.innerText || "").trim(),
                              links,
                              images,
                              backgrounds: [...new Set(backgrounds)],
                              jsonScripts,
                              metas
                            };
                          }""")
                          data["url"] = page.url
                          data["status"] = resp.status if resp else None
                          pages.append(data)

                          for link in data.get("links", []):
                              u = norm(link.get("href"))
                              if u and crawlable(u) and u not in seen and u not in queue:
                                  queue.append(u)
                      except Exception as exc:
                          errors.append({"url": url, "error": repr(exc)})

                  await browser.close()

              parsed_api = {}
              for u, body in api.items():
                  try:
                      parsed_api[u] = json.loads(body)
                  except Exception:
                      parsed_api[u] = body

              out = {
                  "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "pages_crawled": len(pages),
                  "pages": pages,
                  "api_responses": parsed_api,
                  "errors": errors,
              }
              with open("fabricplus_scrape.json", "w", encoding="utf-8") as f:
                  json.dump(out, f, ensure_ascii=False, indent=2)

          asyncio.run(main())
          PY
          python /tmp/fabricplus_scrape.py

      - name: Commit scrape output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fabricplus_scrape.json
          git commit -m "Temporary FabricPlus catalog scrape" || exit 0
          git push
